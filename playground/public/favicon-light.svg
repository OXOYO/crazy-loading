<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Crazy Loading">
  <rect width="32" height="32" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(4 4)">
    <style>
      .p {
        fill: none;
        stroke: #2563eb;
        stroke-width: 1.5;
        opacity: 0.5;
      }
      .b {
        fill: #2563eb;
        animation: sg 2.4s ease-in-out infinite;
      }
      .a {
        stroke: #2563eb;
        opacity: 0.28;
      }
      @keyframes sg {
        0% { transform: translate(3px, 18px); }
        20% { transform: translate(8px, 6px); }
        40% { transform: translate(13px, 12px); }
        60% { transform: translate(17px, 9px); }
        80% { transform: translate(20px, 14px); }
        100% { transform: translate(3px, 18px); }
      }
    </style>
    <path class="a" d="M2 16h20" fill="none" stroke-width="1.25"/>
    <path class="p" d="M3 18Q7 4 11 8Q14 11 16 9Q18 7 21 16"/>
    <circle class="b" cx="0" cy="0" r="2"/>
  </g>
</svg>
