<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Crazy Loading">
  <rect width="32" height="32" rx="7" fill="#0b1020"/>
  <style>
    .wave {
      fill: none;
      stroke: #60a5fa;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-dasharray: 22;
      animation: draw 1.6s ease-in-out infinite;
    }
    .dot {
      fill: #60a5fa;
      animation: travel 1.6s ease-in-out infinite;
    }
    @keyframes draw {
      0%, 100% { stroke-dashoffset: 22; }
      50% { stroke-dashoffset: 0; }
    }
    @keyframes travel {
      0% { transform: translate(5px, 16px); opacity: 0.45; }
      50% { transform: translate(16px, 11px); opacity: 1; }
      100% { transform: translate(27px, 16px); opacity: 0.45; }
    }
  </style>
  <path class="wave" d="M5 16c2-5 4-5 6 0s4 5 6 0 4-5 6 0"/>
  <circle class="dot" cx="0" cy="0" r="2"/>
</svg>
