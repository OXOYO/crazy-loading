<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .axis {
      stroke: currentColor;
      stroke-width: 1;
      opacity: 0.25;
    }
    .ray {
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      transform-origin: 12px 14px;
      animation: expand 1.8s ease-in-out infinite;
    }
    .future { animation-delay: 0s; }
    .past { animation-delay: 0.2s; }
    .event { fill: currentColor; }
    @keyframes expand {
      0%, 100% { transform: scaleY(0.65); opacity: 0.35; }
      50% { transform: scaleY(1); opacity: 1; }
    }
  </style>
  <line class="axis" x1="12" y1="3" x2="12" y2="21"/>
  <line class="axis" x1="4" y1="14" x2="20" y2="14"/>
  <line class="ray future" x1="12" y1="14" x2="18" y2="5"/>
  <line class="ray past" x1="12" y1="14" x2="6" y2="5"/>
  <circle class="event" cx="12" cy="14" r="2"/>
</svg>
