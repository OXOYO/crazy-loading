<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .bar {
      fill: currentColor;
      transform-origin: center bottom;
      animation: scale 1.2s ease-in-out infinite;
    }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 0.15s; }
    .b3 { animation-delay: 0.3s; }
    .b4 { animation-delay: 0.45s; }
    .b5 { animation-delay: 0.6s; }
    @keyframes scale {
      0%, 100% { transform: scaleY(0.35); opacity: 0.35; }
      50% { transform: scaleY(1); opacity: 1; }
    }
  </style>
  <rect class="bar b1" x="3" y="14" width="2.5" height="7" rx="0.5"/>
  <rect class="bar b2" x="7" y="10" width="2.5" height="11" rx="0.5"/>
  <rect class="bar b3" x="11" y="6" width="2.5" height="15" rx="0.5"/>
  <rect class="bar b4" x="15" y="10" width="2.5" height="11" rx="0.5"/>
  <rect class="bar b5" x="19" y="14" width="2.5" height="7" rx="0.5"/>
</svg>
