<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .mass {
      fill: currentColor;
      animation: oscillate 1.4s ease-in-out infinite;
    }
    .spring {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: stretch 1.4s ease-in-out infinite;
      transform-origin: 4px 12px;
    }
    @keyframes oscillate {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }
    }
    @keyframes stretch {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.18); }
    }
  </style>
  <path class="spring" d="M4 12h2l1.2-2 1.2 4 1.2-4 1.2 4 1.2-4 1.2 4h2"/>
  <rect class="mass" x="16" y="9" width="4" height="6" rx="1"/>
</svg>
