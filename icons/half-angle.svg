<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.a{stroke:currentColor;stroke-width:1.4;transform-origin:12px 14px;animation:ha 2s ease-in-out infinite}.b{stroke:currentColor;stroke-width:1.2;opacity:.35}@keyframes ha{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}</style><line class="b" x1="4" y1="16" x2="20" y2="16"/><line class="a" x1="12" y1="14" x2="18" y2="8"/><line class="a" x1="12" y1="14" x2="18" y2="14" style="animation-delay:.5s;opacity:.5"/></svg>
