<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.c{stroke:currentColor;stroke-width:1.4;fill:none;animation:ce 1.52s ease-in-out infinite;transform-origin:12px 12px}.n{fill:currentColor;animation:sp 1.52s ease-in-out infinite}@keyframes ce{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.15)}}@keyframes sp{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}</style><ellipse class="c" cx="12" cy="12" rx="7" ry="4"/><circle class="n" cx="9" cy="12" r="1.2"/><circle class="n" cx="15" cy="12" r="1.2" style="animation-delay:.15s"/></svg>
