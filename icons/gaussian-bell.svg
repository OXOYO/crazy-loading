<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .bell {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-dasharray: 34;
      stroke-dashoffset: 34;
      animation: draw 2s ease-in-out infinite;
    }
    .scanner {
      fill: currentColor;
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes draw {
      0%, 100% { stroke-dashoffset: 34; opacity: 0.45; }
      50% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translate(4px, 16px); opacity: 0.35; }
      50% { transform: translate(12px, 7px); opacity: 1; }
      100% { transform: translate(20px, 16px); opacity: 0.35; }
    }
  </style>
  <path class="bell" d="M3 18c2-10 4-12 9-12s7 2 9 12"/>
  <circle class="scanner" cx="0" cy="0" r="1.75"/>
</svg>
