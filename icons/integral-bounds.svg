<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .symbol {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bound {
      fill: currentColor;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .bound-top { animation-delay: 0s; }
    .bound-bottom { animation-delay: 0.6s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(1px); }
    }
  </style>
  <rect class="bound bound-top" x="15" y="4" width="4" height="1.5" rx="0.5"/>
  <rect class="bound bound-bottom" x="15" y="18.5" width="4" height="1.5" rx="0.5"/>
  <path class="symbol" d="M6 4c-1.5 2-2 5-2 8s.5 6 2 8"/>
  <path class="symbol" d="M14 6v12" opacity="0.45"/>
</svg>
