<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.msk{fill:none;stroke:currentColor;stroke-width:1.35}.fig{animation:lg 1.48s ease-in-out infinite;transform-origin:7px 15px}.sw{animation:pr 1.48s ease-in-out infinite;transform-origin:8px 10.5px}@keyframes lg{0%,100%{transform:translateX(0) rotate(0deg)}38%{transform:translateX(2.5px) rotate(4deg)}52%{transform:translateX(2.5px) rotate(4deg)}72%{transform:translateX(0) rotate(0deg)}}@keyframes pr{0%,100%{transform:rotate(-8deg)}38%{transform:rotate(6deg) translateX(2px)}52%{transform:rotate(6deg) translateX(2px)}72%{transform:rotate(-8deg)}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><g class="fig"><circle class="h" cx="7" cy="8.5" r="1.35"/><circle class="msk" cx="7" cy="8.5" r="1.85"/><line class="f" x1="7" y1="10" x2="7.5" y2="13.5"/><line class="f" x1="7.5" y1="13.5" x2="9.5" y2="18"/><line class="f" x1="7.5" y1="13.5" x2="5.5" y2="18"/><line class="f" x1="7" y1="11" x2="5.5" y2="12.5"/><g class="sw"><line class="f" x1="7" y1="11" x2="14.5" y2="10.2"/><line class="f" x1="14.5" y1="10.2" x2="16" y2="10"/></g></g></svg>
