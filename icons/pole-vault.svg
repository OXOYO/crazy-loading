<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.pt{stroke:currentColor;stroke-width:1.6;stroke-linecap:round}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.pl{stroke:currentColor;stroke-width:1.35;stroke-linecap:round;fill:none}.fig{animation:pv 1.5s ease-in-out infinite;transform-origin:0px 0px}.pole{animation:po 1.5s ease-in-out infinite;transform-origin:5px 17px}@keyframes pv{0%{transform:translate(3px,13px) rotate(18deg)}22%{transform:translate(7px,13px) rotate(22deg)}38%{transform:translate(9px,11px) rotate(-8deg)}55%{transform:translate(12px,6px) rotate(-92deg)}72%{transform:translate(15px,9px) rotate(-148deg)}88%{transform:translate(18px,12px) rotate(-175deg)}100%{transform:translate(20px,13px) rotate(-178deg)}}@keyframes po{0%,18%{transform:rotate(-8deg)}30%{transform:rotate(-42deg)}48%{transform:rotate(-78deg)}62%{transform:rotate(-95deg)}78%,100%{transform:rotate(-108deg)}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><line class="pt" x1="6" y1="9" x2="6" y2="18"/><line class="pt" x1="16" y1="9" x2="16" y2="18"/><line class="pt" x1="6" y1="9" x2="16" y2="9"/><rect class="gd" x="4.5" y="17" width="2" height="1" rx=".2"/><g class="pole"><line class="pl" x1="5" y1="17" x2="8" y2="4"/></g><g class="fig"><circle class="h" cx="0" cy="-5.2" r="1.35"/><line class="f" x1="0" y1="-3.8" x2="0" y2="0"/><line class="f" x1="0" y1="-2.8" x2="-2" y2="-1"/><line class="f" x1="0" y1="-2.8" x2="2.2" y2="-3.5"/><line class="f" x1="0" y1="0" x2="-2" y2="4.5"/><line class="f" x1="0" y1="0" x2="2" y2="4.5"/></g></svg>
