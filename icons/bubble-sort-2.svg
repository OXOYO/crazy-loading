<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.b{fill:currentColor}.b1{animation:s1 1.88 ease-in-out infinite}.b2{animation:s2 1.88 ease-in-out infinite}.b3{animation:s3 1.88 ease-in-out infinite}@keyframes s1{0%,100%{transform:translate(6px,14px)}50%{transform:translate(10px,14px)}}@keyframes s2{0%,100%{transform:translate(10px,10px)}50%{transform:translate(14px,10px)}}@keyframes s3{0%,100%{transform:translate(14px,6px)}50%{transform:translate(10px,6px)}}</style><rect class="b b1" x="0" y="0" width="3" height="6" rx=".5"/><rect class="b b2" x="0" y="0" width="3" height="10" rx=".5"/><rect class="b b3" x="0" y="0" width="3" height="14" rx=".5"/><circle cx="12" cy="17" r="0.50" fill="currentColor" opacity="0.24"/></svg>
