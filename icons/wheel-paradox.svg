<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.w{fill:none;stroke:currentColor;stroke-width:1.25;opacity:.35}.g{animation:rl 1.75s linear infinite}.g2{animation:rl2 1.75s linear infinite}@keyframes rl{0%{transform:translate(5px,16px) rotate(0deg)}100%{transform:translate(17px,16px) rotate(360deg)}}@keyframes rl2{0%{transform:translate(17px,16px) rotate(0deg)}100%{transform:translate(17px,16px) rotate(-540deg)}}</style><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="1" opacity=".25"/><g class="g"><circle class="w" cx="0" cy="0" r="3"/><line x1="0" y1="-3" x2="0" y2="3" stroke="currentColor" stroke-width="1.25"/></g><g class="g2"><circle class="w" cx="0" cy="0" r="1.75"/><line x1="0" y1="-1.75" x2="0" y2="1.75" stroke="currentColor" stroke-width="1"/></g></svg>
