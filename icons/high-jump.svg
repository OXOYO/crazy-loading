<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.pt{stroke:currentColor;stroke-width:1.75;stroke-linecap:round}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.fig{animation:jv 1.75s ease-in-out infinite;transform-origin:0px 0px}@keyframes jv{0%{transform:translate(4px,13px) rotate(20deg)}28%{transform:translate(8px,11px) rotate(-25deg)}52%{transform:translate(12px,5px) rotate(-88deg)}78%{transform:translate(16px,10px) rotate(-135deg)}100%{transform:translate(19px,13px) rotate(-165deg)}}</style><line class="gd" x1="3" y1="18" x2="21" y2="18"/><line class="pt" x1="7" y1="10" x2="7" y2="18"/><line class="pt" x1="17" y1="10" x2="17" y2="18"/><line class="pt" x1="7" y1="10" x2="17" y2="10"/><g class="fig"><circle class="h" cx="0" cy="-5.5" r="1.4"/><line class="f" x1="0" y1="-4" x2="0" y2="0"/><line class="f" x1="0" y1="-3" x2="-2.5" y2="-1.5"/><line class="f" x1="0" y1="-3" x2="2" y2="-4"/><line class="f" x1="0" y1="0" x2="-2" y2="4.5"/><line class="f" x1="0" y1="0" x2="2" y2="4.5"/></g></svg>
