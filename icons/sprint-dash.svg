<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.ru{transform-origin:13px 15px;animation:rn 1.02s linear infinite}.l1{transform-origin:12.5px 14px;animation:lg1 1.02s linear infinite}.l2{transform-origin:13.5px 14px;animation:lg2 1.02s linear infinite}.a1{transform-origin:13px 10px;animation:ar1 1.02s linear infinite}.a2{transform-origin:13px 10px;animation:ar2 1.02s linear infinite}.sp{stroke:currentColor;stroke-width:1.25;stroke-linecap:round;opacity:.35;animation:sl 1.02s linear infinite}@keyframes rn{0%,100%{transform:rotate(20deg) translateY(0)}50%{transform:rotate(20deg) translateY(1px)}}@keyframes lg1{0%,100%{transform:rotate(46deg)}50%{transform:rotate(-58deg)}}@keyframes lg2{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(46deg)}}@keyframes ar1{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(152deg)}}@keyframes ar2{0%,100%{transform:rotate(152deg)}50%{transform:rotate(-34deg)}}@keyframes sl{0%,100%{opacity:.15;transform:translateX(0)}50%{opacity:.55;transform:translateX(-3px)}}</style><line class="sp" x1="2" y1="10" x2="7" y2="10"/><line class="sp" x1="1" y1="13" x2="6" y2="13" style="animation-delay:.06s"/><g class="ru"><circle class="h" cx="13" cy="7" r="1.75"/><line class="f" x1="13" y1="8.5" x2="13" y2="14"/><line class="f l1" x1="12.5" y1="14" x2="12.5" y2="19.5"/><line class="f l2" x1="13.5" y1="14" x2="13.5" y2="19.5"/><line class="f a1" x1="13" y1="10" x2="17" y2="10"/><line class="f a2" x1="13" y1="10" x2="17" y2="10"/></g></svg>
