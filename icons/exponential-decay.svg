<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .curve {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
    }
    .bar {
      fill: currentColor;
      transform-origin: center bottom;
      animation: decay 1.6s ease-in-out infinite;
    }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: 0.2s; }
    .b3 { animation-delay: 0.4s; }
    .b4 { animation-delay: 0.6s; }
    @keyframes decay {
      0%, 100% { transform: scaleY(1); opacity: 1; }
      50% { transform: scaleY(0.25); opacity: 0.3; }
    }
  </style>
  <path class="curve" d="M3 5c3 0 5 2 7 8s4 9 11 9"/>
  <rect class="bar b1" x="4" y="10" width="2" height="8" rx="0.5"/>
  <rect class="bar b2" x="8" y="12" width="2" height="6" rx="0.5"/>
  <rect class="bar b3" x="12" y="14" width="2" height="4" rx="0.5"/>
  <rect class="bar b4" x="16" y="16" width="2" height="2" rx="0.5"/>
</svg>
