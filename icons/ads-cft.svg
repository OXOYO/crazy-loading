<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.x{stroke:currentColor;stroke-width:1;opacity:.25}.r{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;transform-origin:12px 14px;animation:ex 2.2s ease-in-out infinite}.e{fill:currentColor}@keyframes ex{0%,100%{transform:scaleY(.65);opacity:.35}50%{transform:scaleY(1);opacity:1}}</style><line class="x" x1="12" y1="3" x2="12" y2="21"/><line class="x" x1="4" y1="14" x2="20" y2="14"/><line class="r" x1="12" y1="14" x2="18" y2="5"/><line class="r" x1="12" y1="14" x2="6" y2="5" style="animation-delay:.2s"/><circle class="e" cx="12" cy="14" r="2"/><circle cx="12" cy="21" r="0.60" fill="currentColor" opacity="0.24"/></svg>
