<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .sigmoid {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
      animation: grow 2s ease-in-out infinite;
    }
    .dot {
      fill: currentColor;
      animation: saturate 2s ease-in-out infinite;
    }
    @keyframes grow {
      0% { stroke-dashoffset: 28; }
      60%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes saturate {
      0% { transform: translate(4px, 18px); opacity: 0.35; }
      60%, 100% { transform: translate(18px, 8px); opacity: 1; }
    }
  </style>
  <path class="sigmoid" d="M3 18c0-2 2-8 9-8s9 6 9 8"/>
  <circle class="dot" cx="0" cy="0" r="1.75"/>
</svg>
