<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .slash {
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: flash 1s ease-in-out infinite;
    }
    .ring {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.25;
      stroke-dasharray: 18;
      stroke-dashoffset: 18;
      animation: spin-draw 1.6s linear infinite;
      transform-origin: 12px 12px;
    }
    .tick {
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0.7;
    }
    @keyframes flash {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes spin-draw {
      0% { stroke-dashoffset: 18; transform: rotate(0deg); }
      50% { stroke-dashoffset: 0; transform: rotate(180deg); }
      100% { stroke-dashoffset: -18; transform: rotate(360deg); }
    }
  </style>
  <circle class="ring" cx="12" cy="12" r="7"/>
  <line class="tick" x1="6" y1="15" x2="9" y2="9"/>
  <line class="tick" x1="9" y1="15" x2="12" y2="9"/>
  <line class="slash" x1="13" y1="8" x2="17" y2="16"/>
</svg>
