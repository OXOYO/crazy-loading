<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      opacity: 0.25;
    }
    .arc {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: unwind 2.2s ease-in-out infinite;
    }
    @keyframes unwind {
      0% { stroke-dashoffset: 30; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -30; }
    }
  </style>
  <rect class="box" x="11" y="11" width="8" height="8"/>
  <rect class="box" x="11" y="7" width="5" height="4"/>
  <rect class="box" x="7" y="7" width="4" height="5"/>
  <path class="arc" d="M19 11a8 8 0 0 0-8-8 5 5 0 0 0-5 5 4 4 0 0 0 4 4"/>
</svg>
