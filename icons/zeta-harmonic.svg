<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.b{fill:currentColor;transform-origin:center bottom;animation:ad 2s ease-in-out infinite}.s{stroke:currentColor;stroke-width:1.25;stroke-dasharray:4 3;opacity:.4}.t{fill:currentColor;animation:up 2s ease-in-out infinite}@keyframes ad{0%,100%{opacity:.35}50%{opacity:1}}@keyframes up{0%{transform:translate(18px,16px)}100%{transform:translate(18px,10px)}}</style><line class="s" x1="4" y1="12" x2="20" y2="12"/><rect class="b" x="5" y="10" width="2" height="8" rx=".4" style="animation-delay:0s"/><rect class="b" x="8" y="12" width="2" height="6" rx=".4" style="animation-delay:.25s"/><rect class="b" x="11" y="13" width="2" height="5" rx=".4" style="animation-delay:.5s"/><rect class="b" x="14" y="14" width="2" height="4" rx=".4" style="animation-delay:.75s"/><circle class="t" cx="0" cy="0" r="1.5"/></svg>
