<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .tri {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linejoin: round;
    }
    .sq {
      fill: currentColor;
      transform-origin: center;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .sa { animation-delay: 0s; opacity: 0.35; }
    .sb { animation-delay: 0.3s; opacity: 0.35; }
    .sc { animation-delay: 0.6s; opacity: 0.35; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1); }
    }
  </style>
  <path class="tri" d="M5 18 L5 11 L12 18 Z"/>
  <rect class="sq sa" x="5" y="18" width="7" height="2" rx="0.4"/>
  <rect class="sq sb" x="3" y="11" width="2" height="7" rx="0.4"/>
  <rect class="sq sc" x="12" y="16" width="5" height="5" rx="0.4" transform="rotate(-45 12 16)"/>
</svg>
