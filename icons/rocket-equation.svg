<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.h{fill:currentColor}.b{fill:none;stroke:currentColor;stroke-width:1.25}.m{fill:currentColor;transform-origin:11px 15px;animation:ms 2s ease-in-out infinite}.f{fill:currentColor;transform-origin:11px 18px;animation:ex 2s ease-in-out infinite}.v{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;animation:dv 2s ease-in-out infinite}.p{fill:currentColor;opacity:.55;animation:ej 2s ease-in-out infinite}@keyframes ms{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}@keyframes ex{0%,100%{opacity:.3;transform:scaleY(.55)}50%{opacity:1;transform:scaleY(1)}}@keyframes dv{0%,100%{transform:scaleY(.45);opacity:.35}50%{transform:scaleY(1);opacity:1}}@keyframes ej{0%{transform:translate(9px,14px);opacity:0}35%{opacity:.75}100%{transform:translate(9px,21px);opacity:0}}</style><path class="h" d="M10 5 L14 5 L12 8 Z"/><rect class="b" x="10" y="8" width="4" height="5" rx=".5"/><rect class="m" x="10.5" y="13" width="3" height="4" rx=".4"/><rect class="f" x="9" y="18" width="1.5" height="2.5" rx=".3"/><rect class="f" x="12.5" y="18" width="1.5" height="2.5" rx=".3" style="animation-delay:.12s"/><line class="v" x1="19" y1="17" x2="19" y2="7" style="transform-origin:19px 17px"/><polyline class="v" points="17,9 19,6 21,9" fill="none"/><circle class="p" cx="0" cy="0" r=".9"/><circle class="p" cx="0" cy="0" r=".9" style="animation-delay:.5s"/></svg>
