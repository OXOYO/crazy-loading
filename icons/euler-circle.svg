<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .ring {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.25;
      opacity: 0.35;
    }
    .rotor {
      transform-origin: 12px 12px;
      animation: spin 2s linear infinite;
    }
    .radius {
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .dot { fill: currentColor; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <circle class="ring" cx="12" cy="12" r="7"/>
  <g class="rotor">
    <line class="radius" x1="12" y1="12" x2="19" y2="12"/>
    <circle class="dot" cx="19" cy="12" r="2"/>
  </g>
</svg>
