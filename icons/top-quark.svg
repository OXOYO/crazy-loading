<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.d{fill:currentColor;animation:dc 1.4s ease-in-out infinite}.j{stroke:currentColor;stroke-width:1.2;animation:jt 1.4s ease-out infinite}@keyframes dc{0%,100%{opacity:1}50%{opacity:.2}}@keyframes jt{0%,70%{opacity:0}75%{opacity:1}100%{opacity:0;transform:translate(4px,-4px)}}</style><circle class="d" cx="12" cy="14" r="2"/><line class="j" x1="12" y1="14" x2="16" y2="8"/><line class="j" x1="12" y1="14" x2="8" y2="9" style="animation-delay:.15s"/></svg>
