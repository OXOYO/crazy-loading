<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.pt{stroke:currentColor;stroke-width:1.6;stroke-linecap:round}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.fg{stroke:currentColor;stroke-width:1.25;opacity:.28;stroke-linecap:round}.fig{animation:hv 1.18s linear infinite;transform-origin:0px 0px}@keyframes hv{0%{transform:translate(3px,13px) rotate(24deg)}20%{transform:translate(8px,13px) rotate(30deg)}36%{transform:translate(11.5px,12px) rotate(8deg)}50%{transform:translate(14px,10.2px) rotate(-68deg)}64%{transform:translate(16.5px,12px) rotate(-18deg)}80%{transform:translate(19px,13px) rotate(26deg)}100%{transform:translate(21px,13px) rotate(28deg)}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><line class="fg" x1="19" y1="14.5" x2="19" y2="18"/><line class="fg" x1="21.5" y1="14.5" x2="21.5" y2="18"/><line class="fg" x1="19" y1="14.5" x2="21.5" y2="14.5"/><line class="pt" x1="12.5" y1="13.5" x2="12.5" y2="18"/><line class="pt" x1="15.5" y1="13.5" x2="15.5" y2="18"/><line class="pt" x1="12.5" y1="13.5" x2="15.5" y2="13.5"/><line class="fg" x1="2" y1="11" x2="6" y2="11"/><line class="fg" x1="1" y1="14" x2="5" y2="14"/><g class="fig"><circle class="h" cx="0" cy="-5.2" r="1.35"/><line class="f" x1="0" y1="-3.8" x2="0" y2="0"/><line class="f" x1="0" y1="-2.8" x2="-2.2" y2="-1.2"/><line class="f" x1="0" y1="-2.8" x2="2.4" y2="-3.6"/><line class="f" x1="0" y1="0" x2="-2.5" y2="4.2"/><line class="f" x1="0" y1="0" x2="2.8" y2="3.8"/></g></svg>
