<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .sigma {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .term {
      fill: currentColor;
      animation: blink 1.5s ease-in-out infinite;
    }
    .t1 { animation-delay: 0s; }
    .t2 { animation-delay: 0.3s; }
    .t3 { animation-delay: 0.6s; }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
  </style>
  <path class="sigma" d="M6 6h10L8 12l8 6H6"/>
  <circle class="term t1" cx="17" cy="8" r="1.25"/>
  <circle class="term t2" cx="19" cy="12" r="1.25"/>
  <circle class="term t3" cx="17" cy="16" r="1.25"/>
</svg>
