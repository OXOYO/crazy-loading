<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .arc {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      opacity: 0.35;
    }
    .body {
      fill: currentColor;
      animation: fly 2s ease-in-out infinite;
    }
    @keyframes fly {
      0% { transform: translate(4px, 17px); }
      25% { transform: translate(9px, 9px); }
      50% { transform: translate(14px, 7px); }
      75% { transform: translate(19px, 11px); }
      100% { transform: translate(4px, 17px); }
    }
  </style>
  <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="1.25" opacity="0.25"/>
  <path class="arc" d="M4 17q5-12 10 0t6-4"/>
  <circle class="body" cx="0" cy="0" r="2"/>
</svg>
