<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.fig{animation:th 1.7s ease-in-out infinite;transform-origin:7px 14px}.jav{animation:fl 1.7s linear infinite;transform-origin:0px 0px}@keyframes th{0%,100%{transform:rotate(0deg)}18%{transform:rotate(-6deg)}38%{transform:rotate(14deg)}52%{transform:rotate(38deg)}68%{transform:rotate(22deg)}82%{transform:rotate(8deg)}}@keyframes fl{0%,42%{transform:translate(7px,10.5px) rotate(-32deg);opacity:1}48%{transform:translate(7px,10px) rotate(-40deg);opacity:1}54%{transform:translate(9.5px,6px) rotate(-28deg);opacity:1}60%{transform:translate(12px,3px) rotate(-14deg);opacity:1}66%{transform:translate(14.5px,2px) rotate(-2deg);opacity:1}72%{transform:translate(17px,4.5px) rotate(14deg);opacity:1}78%{transform:translate(19px,7.5px) rotate(26deg);opacity:1}84%{transform:translate(21px,10.5px) rotate(34deg);opacity:1}90%{transform:translate(22.5px,12.5px) rotate(40deg);opacity:.35}94%,98%{transform:translate(7px,10.5px) rotate(-32deg);opacity:0}100%{transform:translate(7px,10.5px) rotate(-32deg);opacity:1}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><g class="fig"><circle class="h" cx="7" cy="8" r="1.4"/><line class="f" x1="7" y1="9.5" x2="7" y2="14"/><line class="f" x1="7" y1="14" x2="6" y2="18"/><line class="f" x1="7" y1="14" x2="8.5" y2="18"/><line class="f" x1="7" y1="10.5" x2="4.5" y2="12"/></g><g class="jav"><line class="f" x1="0" y1="0" x2="6.5" y2="-2.2"/><polygon points="6.5,-2.2 5,-3 5,-1.4" fill="currentColor"/></g></svg>
