<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .chain {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
    }
    .tight { animation: tight 2s ease-in-out infinite; }
    .loose { animation: loose 2s ease-in-out infinite; }
    .anchor { fill: currentColor; }
    @keyframes tight {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes loose {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
  <circle class="anchor" cx="4" cy="6" r="1.5"/>
  <circle class="anchor" cx="20" cy="6" r="1.5"/>
  <path class="chain tight" d="M4 6c4 8 12 8 16 0"/>
  <path class="chain loose" d="M4 6c4 12 12 12 16 0"/>
</svg>
