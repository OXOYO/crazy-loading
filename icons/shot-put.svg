<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.cr{stroke:currentColor;stroke-width:1.25;opacity:.25;fill:none}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.sh{fill:currentColor}.fig{animation:sp 1.95s ease-in-out infinite;transform-origin:6px 14px}.bl{animation:fl 1.95s ease-in-out infinite;transform-origin:9px 9px}@keyframes sp{0%,38%{transform:rotate(-12deg)}46%{transform:rotate(32deg)}58%,100%{transform:rotate(14deg)}}@keyframes fl{0%,42%{transform:translate(0,0);opacity:1}46%{transform:translate(0,0);opacity:1}54%{transform:translate(4px,-3.5px);opacity:1}62%{transform:translate(8px,-5.5px);opacity:1}70%{transform:translate(12px,-3px);opacity:1}78%{transform:translate(15.5px,1.5px);opacity:1}86%{transform:translate(18px,4px);opacity:.25}90%,98%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:1}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><circle class="cr" cx="6" cy="15" r="3.2"/><g class="fig"><circle class="h" cx="6" cy="8" r="1.4"/><line class="f" x1="6" y1="9.5" x2="6.5" y2="14"/><line class="f" x1="6.5" y1="14" x2="5.5" y2="18"/><line class="f" x1="6.5" y1="14" x2="8" y2="18"/><line class="f" x1="6" y1="10.5" x2="4" y2="11.5"/><line class="f" x1="6" y1="10.5" x2="8.5" y2="10"/></g><circle class="sh bl" cx="9" cy="9" r="1.55"/></svg>
