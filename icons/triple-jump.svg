<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.mk{stroke:currentColor;stroke-width:1.1;opacity:.28;stroke-linecap:round}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.fig{animation:tj 1.15s ease-in-out infinite;transform-origin:0px 0px}@keyframes tj{0%{transform:translate(3px,13px) rotate(18deg)}14%{transform:translate(6.5px,10.5px) rotate(-8deg)}24%{transform:translate(7.5px,13px) rotate(22deg)}34%{transform:translate(10.5px,10px) rotate(-4deg)}46%{transform:translate(11.5px,13px) rotate(20deg)}58%{transform:translate(14.5px,7px) rotate(-72deg)}74%{transform:translate(17.5px,13px) rotate(16deg)}100%{transform:translate(20px,13px) rotate(18deg)}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><line class="mk" x1="7.5" y1="18" x2="7.5" y2="16.5"/><line class="mk" x1="11.5" y1="18" x2="11.5" y2="16.5"/><line class="mk" x1="17.5" y1="18" x2="17.5" y2="16.5"/><g class="fig"><circle class="h" cx="0" cy="-5.2" r="1.35"/><line class="f" x1="0" y1="-3.8" x2="0" y2="0"/><line class="f" x1="0" y1="-2.8" x2="-2.2" y2="-1.2"/><line class="f" x1="0" y1="-2.8" x2="2.2" y2="-3.4"/><line class="f" x1="0" y1="0" x2="-2.5" y2="4.2"/><line class="f" x1="0" y1="0" x2="2.8" y2="3.8"/></g></svg>
