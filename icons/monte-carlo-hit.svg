<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.f{fill:none;stroke:currentColor;stroke-width:1.25;opacity:.35}.d{fill:currentColor;animation:ap 2.05s ease-in-out infinite}.h{animation:hi 2.05s ease-in-out infinite}@keyframes ap{0%,70%{opacity:0;transform:scale(.4)}80%,100%{opacity:.7;transform:scale(1)}}@keyframes hi{0%,70%{opacity:0}80%,100%{opacity:1;transform:scale(1.15)}}</style><rect class="f" x="5" y="5" width="14" height="14" rx="1"/><circle class="f" cx="12" cy="12" r="5.5"/><circle class="d" cx="9" cy="10" r="1" style="animation-delay:0s"/><circle class="d h" cx="14" cy="13" r="1" style="animation-delay:.35s"/><circle class="d" cx="11" cy="15" r="1" style="animation-delay:.7s"/><circle class="d h" cx="13" cy="9" r="1" style="animation-delay:1.05s"/></svg>
