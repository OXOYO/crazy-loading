<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.g{stroke:currentColor;stroke-width:1.25;opacity:.3}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.kg{transform-origin:11px 14px;animation:ki 2.5s ease-in-out infinite}.bl{animation:ro 2.5s ease-in-out infinite;transform-origin:15px 16px}@keyframes ki{0%,100%{transform:rotate(18deg)}40%,60%{transform:rotate(-38deg)}}@keyframes ro{0%,100%{transform:translateX(-4px) rotate(0deg)}50%{transform:translateX(4px) rotate(180deg)}}</style><line class="g" x1="3" y1="18" x2="21" y2="18"/><circle class="h" cx="10" cy="8" r="1.5"/><line class="f" x1="10" y1="9.5" x2="11" y2="14"/><line class="f" x1="11" y1="14" x2="10" y2="18"/><line class="f kg" x1="11" y1="14" x2="15" y2="16"/><line class="f" x1="10" y1="11" x2="8" y2="10"/><line class="f" x1="10" y1="11" x2="12" y2="10"/><g class="bl"><circle cx="15" cy="16" r="2.1" fill="none" stroke="currentColor" stroke-width="1.35"/><polygon points="15,14.9 15.9,15.4 15.6,16.3 14.4,16.3 14.1,15.4" fill="currentColor" opacity=".45"/></g></svg>
