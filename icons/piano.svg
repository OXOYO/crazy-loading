<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.k{fill:currentColor;animation:ky 1.4s ease-in-out infinite;transform-origin:12px 16px}.h{stroke:currentColor;stroke-width:1.4;animation:ht 1.4s ease-in-out infinite;transform-origin:12px 18px}@keyframes ky{0%,100%{transform:rotate(0deg)}50%{transform:rotate(6deg)}}@keyframes ht{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}</style><rect class="k" x="8" y="8" width="8" height="10" rx="1"/><line class="h" x1="10" y1="18" x2="14" y2="18"/></svg>
