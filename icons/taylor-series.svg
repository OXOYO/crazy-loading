<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .term {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .t1 { opacity: 0.3; animation: step 2.4s ease-in-out infinite; }
    .t2 { opacity: 0.3; animation: step 2.4s ease-in-out infinite 0.4s; }
    .t3 { opacity: 0.3; animation: step 2.4s ease-in-out infinite 0.8s; }
    @keyframes step {
      0%, 100% { opacity: 0.25; }
      20%, 70% { opacity: 1; }
    }
  </style>
  <path class="term t1" d="M3 17c0-4 3-7 9-7"/>
  <path class="term t2" d="M3 17c1-7 4-10 9-10s6 2 9 5"/>
  <path class="term t3" d="M3 17c2-10 5-13 9-13s7 3 9 10"/>
</svg>
