<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.gd{stroke:currentColor;stroke-width:1.25;opacity:.3}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.hb{fill:currentColor}.w{stroke:currentColor;stroke-width:1.15;stroke-linecap:round}.fig{animation:bd 2.25s ease-in-out infinite;transform-origin:7px 14px}.ham{animation:sw 2.25s linear infinite;transform-origin:7px 11px}@keyframes bd{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}@keyframes sw{0%{transform:rotate(-75deg)}100%{transform:rotate(285deg)}}</style><line class="gd" x1="2" y1="18" x2="22" y2="18"/><g class="fig"><circle class="h" cx="7" cy="8" r="1.4"/><line class="f" x1="7" y1="9.5" x2="7" y2="14"/><line class="f" x1="7" y1="14" x2="6" y2="18"/><line class="f" x1="7" y1="14" x2="8.5" y2="18"/><line class="f" x1="7" y1="10.5" x2="5" y2="11.5"/></g><g class="ham"><line class="w" x1="7" y1="11" x2="15" y2="11"/><circle class="hb" cx="15" cy="11" r="1.65"/></g></svg>
