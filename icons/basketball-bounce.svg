<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.g{stroke:currentColor;stroke-width:1.25;opacity:.3}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.ply{animation:sq 2.35s ease-in-out infinite;transform-origin:11px 17px}.ar{transform-origin:11px 10px;animation:dr 2.35s ease-in-out infinite}.l1{transform-origin:11px 14px;animation:kn 2.35s ease-in-out infinite}.l2{transform-origin:11px 14px;animation:kn 2.35s ease-in-out infinite reverse}.bl{animation:bo 2.35s ease-in-out infinite;transform-origin:13.4px 15px}@keyframes sq{0%,100%{transform:translateY(0)}45%,55%{transform:translateY(1px)}}@keyframes dr{0%,100%{transform:rotate(-36deg)}45%,55%{transform:rotate(16deg)}}@keyframes kn{0%,100%{transform:rotate(-6deg)}45%,55%{transform:rotate(10deg)}}@keyframes bo{0%,100%{transform:translateY(-2px)}45%,55%{transform:translateY(0)}}</style><line class="g" x1="3" y1="18" x2="21" y2="18"/><g class="ply"><circle class="h" cx="11" cy="7" r="1.5"/><line class="f" x1="11" y1="8.5" x2="11" y2="14"/><line class="f l1" x1="11" y1="14" x2="10" y2="18"/><line class="f l2" x1="11" y1="14" x2="12" y2="18"/><line class="f" x1="11" y1="10" x2="9" y2="12"/><g class="ar"><line class="f" x1="11" y1="10" x2="13" y2="14"/><g class="bl"><circle cx="13.4" cy="15" r="1.85" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M11.55 15h3.7" fill="none" stroke="currentColor" stroke-width=".9" opacity=".5"/></g></g></g></svg>
