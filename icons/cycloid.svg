<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .trace {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      opacity: 0.35;
    }
    .wheel {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.25;
      animation: roll 2s linear infinite;
    }
    .rim-dot { fill: currentColor; }
    .trace-dot {
      fill: currentColor;
      animation: trace 2s linear infinite;
    }
    @keyframes roll {
      0% { transform: translate(4px, 14px) rotate(0deg); }
      100% { transform: translate(18px, 14px) rotate(360deg); }
    }
    @keyframes trace {
      0% { transform: translate(4px, 8px); }
      25% { transform: translate(9px, 5px); }
      50% { transform: translate(14px, 8px); }
      75% { transform: translate(19px, 5px); }
      100% { transform: translate(4px, 8px); }
    }
  </style>
  <path class="trace" d="M4 8c3-4 6-4 10 0s6 4 10 0"/>
  <line x1="3" y1="17" x2="21" y2="17" stroke="currentColor" stroke-width="1.25" opacity="0.35"/>
  <g class="wheel">
    <circle cx="0" cy="0" r="3"/>
    <circle class="rim-dot" cx="0" cy="-3" r="1.25"/>
  </g>
  <circle class="trace-dot" cx="0" cy="0" r="1.5"/>
</svg>
