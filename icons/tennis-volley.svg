<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><style>.n{stroke:currentColor;stroke-width:1;opacity:.35;stroke-dasharray:2 2}.f{stroke:currentColor;stroke-width:1.5;stroke-linecap:round;fill:none}.h{fill:currentColor}.sw{transform-origin:5px 11px;animation:vl 1.4s linear infinite}.rk{stroke:currentColor;stroke-width:1.35;fill:none}.bl{fill:currentColor;animation:bl 1.4s linear infinite;transform-origin:10.5px 8.5px}@keyframes vl{0%,52%,100%{transform:rotate(-28deg)}24%{transform:rotate(40deg)}28%,34%{transform:rotate(40deg)}42%{transform:rotate(10deg)}}@keyframes bl{0%{transform:translate(10px,2.8px);opacity:1}14%{transform:translate(6.5px,2px);opacity:1}24%{transform:translate(1.2px,0.3px);opacity:1}28%,34%{transform:translate(0,0);opacity:1}36%{transform:translate(1.5px,-0.8px);opacity:1}40%{transform:translate(5.5px,-2.6px);opacity:1}44%{transform:translate(9px,-4px);opacity:1}47%{transform:translate(10.5px,-4.5px);opacity:0}48%,99%{transform:translate(10px,2.8px);opacity:0}100%{transform:translate(10px,2.8px);opacity:1}}</style><line class="n" x1="12" y1="4" x2="12" y2="19"/><circle class="h" cx="5" cy="9" r="1.4"/><line class="f" x1="5" y1="10.5" x2="5" y2="15"/><line class="f" x1="5" y1="15" x2="4" y2="18"/><line class="f" x1="5" y1="15" x2="6" y2="18"/><line class="f" x1="5" y1="11" x2="7" y2="12"/><g class="sw"><line class="f" x1="5" y1="11" x2="7.5" y2="10.5"/><line class="f" x1="7.5" y1="10.5" x2="7.5" y2="12.5"/><ellipse class="rk" cx="10" cy="8.5" rx="1.65" ry="2.15"/></g><circle class="bl" cx="10.5" cy="8.5" r="1.3"/></svg>
