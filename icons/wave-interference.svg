<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .wave {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.25;
      stroke-linecap: round;
    }
    .w1 { opacity: 0.4; animation: drift 1.6s ease-in-out infinite; }
    .w2 { opacity: 0.4; animation: drift 1.6s ease-in-out infinite reverse; }
    .sum {
      stroke-width: 1.75;
      animation: beat 1.6s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }
    @keyframes beat {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>
  <path class="wave w1" d="M3 10c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>
  <path class="wave w2" d="M3 14c2 3 4 3 6 0s4-3 6 0 4 3 6 0"/>
  <path class="wave sum" d="M3 12c1.5-5 3-5 4.5 0s3 5 4.5 0 3-5 4.5 0 3 5 4.5 0"/>
</svg>
